name: Build Meeting Agent APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Generate Android project
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'settings.gradle.kts')"
          printf '%s' '' | base64 -d > 'settings.gradle.kts'
          mkdir -p "$(dirname 'build.gradle.kts')"
          printf '%s' 'cGx1Z2lucyB7IGlkKCJjb20uYW5kcm9pZC5hcHBsaWNhdGlvbiIpIHZlcnNpb24gIjguNy4zIiBhcHBseSBmYWxzZSB9Cg==' | base64 -d > 'build.gradle.kts'
          mkdir -p "$(dirname 'gradle.properties')"
          printf '%s' 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg==' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          printf '%s' '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          printf '%s' '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          printf '%s' 'PHJlc291cmNlcz48c3R5bGUgbmFtZT0iVGhlbWUuTWVldGluZ0FnZW50IiBwYXJlbnQ9IkBhbmRyb2lkOnN0eWxlL1RoZW1lLk1hdGVyaWFsLkxpZ2h0Lk5vQWN0aW9uQmFyIj48aXRlbSBuYW1lPSJhbmRyb2lkOmZvbnRGYW1pbHkiPnNhbnM8L2l0ZW0+PGl0ZW0gbmFtZT0iYW5kcm9pZDpjb2xvckFjY2VudCI+IzY3NTBBNDwvaXRlbT48L3N0eWxlPjwvcmVzb3VyY2VzPgo=' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/niamulkarim/meetingagent/MainActivity.java')"
          printf '%s' '' | base64 -d > 'app/src/main/java/com/niamulkarim/meetingagent/MainActivity.java'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meeting-Agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
